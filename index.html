<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120d16"><title>MR AN CREATIVITY — Order Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--ink:#241b24;--muted:#806d7b;--paper:#fffaf6;--card:#fff;--plum:#6d315d;--rose:#c46c88;--peach:#f4c7b8;--gold:#c99b52;--line:#eee0da;--ok:#358b68;--shadow:0 18px 50px #4b263114}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#ffe5df 0,transparent 28%),var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:245px;background:#241b24;color:#fff;padding:25px 16px;display:flex;flex-direction:column}.brand{font:700 19px 'Playfair Display';letter-spacing:.5px;padding:7px 12px 30px}.brand small{display:block;color:#e9a8b7;font:600 9px 'DM Sans';letter-spacing:2px;margin-top:5px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#cdbec8;text-align:left;padding:12px;border-radius:10px}.nav button:hover,.nav button.active{background:#ffffff16;color:#fff}.bottom{margin-top:auto;color:#bca9b5;font-size:12px;padding:12px}.main{flex:1;padding:25px 34px;max-width:1500px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{color:var(--rose);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.top h1{font:700 clamp(25px,3vw,39px) 'Playfair Display';margin:4px 0}.actions{display:flex;gap:10px;align-items:center}.btn{padding:11px 15px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:600}.btn.primary{background:var(--plum);color:#fff;border-color:var(--plum)}.btn.gold{background:var(--gold);color:#fff}.btn.icon{font-size:18px;padding:8px 11px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:23px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.stat b{display:block;font:700 27px 'Playfair Display'}.stat span{color:var(--muted);font-size:12px}.stat i{float:right;font-style:normal;color:var(--ok);font-size:11px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);padding:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sectionhead h2{font:700 22px 'Playfair Display';margin:0}.filters{display:flex;gap:9px;flex-wrap:wrap}.field{border:1px solid var(--line);background:#fffaf8;border-radius:9px;padding:10px 12px;color:var(--ink);outline:none}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:750px}.table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;padding:12px 10px;border-bottom:1px solid var(--line)}.table td{padding:14px 10px;border-bottom:1px solid #f2e9e5}.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;background:#f7ebe7;color:var(--plum);white-space:nowrap}.pill.ok{background:#e7f5ee;color:var(--ok)}.pill.warn{background:#fff3d9;color:#946916}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.map{height:430px;border-radius:12px;overflow:hidden;background:#f3e7e2}.rider{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.avatar{width:35px;height:35px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--plum));color:#fff;display:grid;place-items:center;font-weight:700}.riderinfo{display:flex;align-items:center;gap:10px}.muted{color:var(--muted);font-size:12px}.hidden{display:none!important}.drawer{position:fixed;inset:0;background:#241b2488;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fffaf6;border-radius:20px;padding:25px;box-shadow:0 30px 100px #241b2466}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{display:grid;gap:6px;color:var(--muted);font-size:12px}.formgrid .full{grid-column:1/-1}.empty{padding:35px;text-align:center;color:var(--muted)}#toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:13px 17px;border-radius:10px;display:none;z-index:30}@media(max-width:850px){.side{width:66px;padding:17px 8px}.brand{font-size:0;padding:8px 5px 25px}.brand:first-letter{font-size:24px}.brand small,.nav button span,.bottom{display:none}.nav button{text-align:center;font-size:18px}.main{padding:20px 15px}.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.top{align-items:flex-start}.top .actions .btn:not(.icon){display:none}}@media(max-width:500px){.grid{gap:8px}.stat{padding:12px}.stat b{font-size:22px}.card{padding:15px}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}}
</style></head><body><div class="app"><aside class="side"><div class="brand">MR AN CREATIVITY<small>RESIN ART · CUSTOM JEWELLERY</small></div><nav class="nav"><button class="active" data-view="dashboard">◈ <span>Dashboard</span></button><button data-view="orders">▣ <span>Orders</span></button><button data-view="tracking">⌁ <span>Live Tracking</span></button><button data-view="partners">♙ <span>Delivery Partners</span></button><button data-view="customers">♡ <span>Customers</span></button><button data-view="products">◇ <span>Products</span></button><button data-view="history">◷ <span>Delivery History</span></button></nav><div class="bottom">Admin workspace<br><span class="pill ok">● Secure session</span></div></aside><main class="main"><header class="top"><div><div class="eyebrow">Order studio / Friday, 25 Sep 2026</div><h1 id="title">Good morning, Yeswanth</h1></div><div class="actions"><button class="btn" onclick="toggleTheme()">◐</button><button class="btn primary" onclick="openOrder()">＋ New order</button></div></header><section id="content"></section></main></div><div id="drawer" class="drawer hidden"><div class="modal" id="modal"></div></div><div id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const seed={orders:[{id:'1025',customer:'Ananya Rao',product:'Custom Blood Bangle',qty:1,amount:2499,date:'25 Sep 2026',payment:'Paid',status:'Out for Delivery',partner:'Suresh',address:'12 Lake View Road, Hyderabad'},{id:'1024',customer:'Maya Krishnan',product:'Resin Initial Pendant',qty:2,amount:1798,date:'25 Sep 2026',payment:'Paid',status:'Preparing',partner:'—',address:'Banjara Hills, Hyderabad'},{id:'1023',customer:'Rohan Das',product:'Blood Chain',qty:1,amount:3199,date:'24 Sep 2026',payment:'Pending',status:'Confirmed',partner:'—',address:'Kondapur, Hyderabad'},{id:'1022',customer:'Diya Shah',product:'Resin Art Keepsake',qty:1,amount:1299,date:'23 Sep 2026',payment:'Paid',status:'Delivered',partner:'Rahul',address:'Jubilee Hills, Hyderabad'}],partners:[{name:'Suresh Kumar',phone:'+91 98765 43210',status:'Online',order:'1025',lat:17.438,lng:78.448},{name:'Rahul Varma',phone:'+91 91234 56789',status:'Busy',order:'—',lat:17.423,lng:78.473},{name:'Meena Joseph',phone:'+91 99887 66554',status:'Offline',order:'—',lat:17.455,lng:78.39}],products:['Blood Bangles','Blood Chains','Blood Bracelets','Resin Art','Custom Jewellery']};let db=JSON.parse(localStorage.mrOrders||'null')||seed;function save(){localStorage.mrOrders=JSON.stringify(db)}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function toast(s){let x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function money(n){return '₹'+Number(n).toLocaleString('en-IN')}function pill(s){let c=s==='Delivered'||s==='Online'?'ok':s==='Preparing'||s==='Pending'||s==='Busy'?'warn':'';return `<span class="pill ${c}">${esc(s)}</span>`}function render(view='dashboard'){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let c=document.getElementById('content');if(view==='dashboard')return dashboard(c);if(view==='orders')return orders(c);if(view==='tracking')return tracking(c);if(view==='partners')return partners(c);if(view==='customers')return customers(c);if(view==='products')return products(c);if(view==='history')return history(c)}
function dashboard(c){let counts=['Total Orders','New Orders','Pending','Processing','Ready for Delivery','Out for Delivery','Delivered','Cancelled'];let nums=[db.orders.length,db.orders.filter(x=>x.status==='Order Placed').length,db.orders.filter(x=>x.status==='Pending').length,db.orders.filter(x=>x.status==='Preparing').length,db.orders.filter(x=>x.status==='Ready').length,db.orders.filter(x=>x.status==='Out for Delivery').length,db.orders.filter(x=>x.status==='Delivered').length,db.orders.filter(x=>x.status==='Cancelled').length];c.innerHTML=`<div class="grid">${counts.map((x,i)=>`<div class="stat"><i>${i===0?'Live':''}</i><b>${nums[i]}</b><span>${x}</span></div>`).join('')}</div><div class="card"><div class="sectionhead"><h2>Recent orders</h2><button class="btn" onclick="render('orders')">View all →</button></div>${orderTable(db.orders.slice(0,5))}</div>`}function orderTable(rows){return `<div class="tablewrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Amount</th><th>Payment</th><th>Status</th><th>Partner</th><th></th></tr></thead><tbody>${rows.map(o=>`<tr><td><b>#${esc(o.id)}</b><br><span class="muted">${esc(o.date)}</span></td><td>${esc(o.customer)}<br><span class="muted">Qty ${o.qty}</span></td><td>${esc(o.product)}</td><td>${money(o.amount)}</td><td>${pill(o.payment)}</td><td>${pill(o.status)}</td><td>${esc(o.partner)}</td><td><button class="btn" onclick="viewOrder('${o.id}')">Track</button></td></tr>`).join('')}</tbody></table></div>`}
function orders(c){c.innerHTML=`<div class="card"><div class="sectionhead"><h2>Orders</h2><div class="filters"><input class="field" id="search" placeholder="Search orders…" oninput="filterOrders()"><select class="field" id="status" onchange="filterOrders()"><option value="">All statuses</option>${['Order Placed','Confirmed','Preparing','Ready','Picked Up','Out for Delivery','Delivered','Cancelled'].map(x=>`<option>${x}</option>`).join('')}</select><button class="btn primary" onclick="openOrder()">＋ Create</button></div></div><div id="orderRows">${orderTable(db.orders)}</div></div>`}function filterOrders(){let q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('status').value;document.getElementById('orderRows').innerHTML=orderTable(db.orders.filter(o=>(!q||JSON.stringify(o).toLowerCase().includes(q))&&(!s||o.status===s)))}
function tracking(c){c.innerHTML=`<div class="layout"><div class="card"><div class="sectionhead"><h2>Live delivery map</h2><span class="pill ok">● Auto-refresh 10s</span></div><div id="map" class="map"></div></div><div class="card"><div class="sectionhead"><h2>Active partners</h2><span class="muted">${db.partners.filter(x=>x.status!=='Offline').length} live</span></div>${db.partners.map(p=>`<div class="rider"><div class="riderinfo"><div class="avatar">${p.name[0]}</div><div><b>${esc(p.name)}</b><br><span class="muted">${pill(p.status)} · Order ${p.order==='—'?'none':'#'+p.order}</span></div></div><span class="muted">${p.status==='Online'?'2.1 km · 8 min':'—'}</span></div>`).join('')}</div></div>`;let map=L.map('map').setView([17.438,78.448],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);db.partners.forEach(p=>{if(p.status!=='Offline')L.marker([p.lat,p.lng]).addTo(map).bindPopup(`<b>🛵 ${esc(p.name)}</b><br>${p.status}<br>📦 Order #${p.order}<br>⏱️ ETA: 8 minutes`)})}
function partners(c){c.innerHTML=`<div class="card"><div class="sectionhead"><h2>Delivery partners</h2><button class="btn primary" onclick="addPartner()">＋ Add partner</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Partner</th><th>Phone</th><th>Status</th><th>Assigned order</th><th>Action</th></tr></thead><tbody>${db.partners.map((p,i)=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.phone)}</td><td>${pill(p.status)}</td><td>${p.order==='—'?'—':'#'+p.order}</td><td><button class="btn" onclick="togglePartner(${i})">${p.status==='Offline'?'Enable':'Disable'}</button></td></tr>`).join('')}</tbody></table></div></div>`}function customers(c){let names=[...new Set(db.orders.map(x=>x.customer))];c.innerHTML=`<div class="card"><div class="sectionhead"><h2>Customers</h2><span class="muted">${names.length} customers</span></div>${names.map(n=>{let os=db.orders.filter(x=>x.customer===n);return `<div class="rider"><div><b>${esc(n)}</b><br><span class="muted">${os.length} order(s) · ${esc(os[0].address)}</span></div><b>${money(os.reduce((a,x)=>a+Number(x.amount),0))}</b></div>`}).join('')}</div>`}function products(c){c.innerHTML=`<div class="card"><div class="sectionhead"><h2>Product catalogue</h2><button class="btn primary" onclick="addProduct()">＋ Add product</button></div>${db.products.map((p,i)=>`<div class="rider"><div><b>${esc(p)}</b><br><span class="muted">Custom resin artwork · Available</span></div><button class="btn" onclick="removeProduct(${i})">Remove</button></div>`).join('')}</div>`}function history(c){let done=db.orders.filter(x=>x.status==='Delivered');c.innerHTML=`<div class="card"><div class="sectionhead"><h2>Delivery history</h2><button class="btn" onclick="toast('CSV export prepared ✓')">⇩ Export CSV</button></div>${orderTable(done)}</div>`}
function openOrder(){document.getElementById('modal').innerHTML=`<div class="sectionhead"><h2>Create order</h2><button class="btn" onclick="closeModal()">×</button></div><form class="formgrid" onsubmit="createOrder(event)"><label>Customer name<input class="field" name="customer" required></label><label>Product<select class="field" name="product">${db.products.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>Quantity<input class="field" name="qty" type="number" value="1" min="1"></label><label>Amount (₹)<input class="field" name="amount" type="number" required></label><label>Payment<select class="field" name="payment"><option>Paid</option><option>Pending</option></select></label><label>Assign partner<select class="field" name="partner"><option>—</option>${db.partners.filter(x=>x.status!=='Offline').map(x=>`<option>${esc(x.name.split(' ')[0])}</option>`).join('')}</select></label><label class="full">Delivery address<textarea class="field" name="address" required rows="3"></textarea></label><button class="btn primary full">Create order →</button></form>`;document.getElementById('drawer').classList.remove('hidden')}function createOrder(e){e.preventDefault();let f=new FormData(e.target);db.orders.unshift({id:String(1026+db.orders.length),customer:f.get('customer'),product:f.get('product'),qty:f.get('qty'),amount:f.get('amount'),date:'25 Sep 2026',payment:f.get('payment'),status:'Order Placed',partner:f.get('partner'),address:f.get('address')});save();closeModal();render('orders');toast('Order created ✓')}function viewOrder(id){let o=db.orders.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<div class="sectionhead"><h2>Order #${o.id}</h2><button class="btn" onclick="closeModal()">×</button></div><p><b>${esc(o.product)}</b> · Qty ${o.qty}</p><p class="muted">${esc(o.customer)} · ${esc(o.address)}</p><hr><label class="muted">Update status</label><select class="field" style="width:100%;margin:7px 0 18px" onchange="updateStatus('${o.id}',this.value)">${['Order Placed','Confirmed','Preparing','Ready','Picked Up','Out for Delivery','Delivered','Cancelled'].map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select><div class="card"><b>Customer tracking link</b><p class="muted">Share securely after dispatch:</p><code>${location.origin}${location.pathname.replace('index.html','')}track.html?order=${o.id}&token=demo-${o.id}</code></div>`;document.getElementById('drawer').classList.remove('hidden')}function updateStatus(id,s){let o=db.orders.find(x=>x.id===id);o.status=s;save();toast('Status updated · notification queued ✓');closeModal();render('orders')}function closeModal(){document.getElementById('drawer').classList.add('hidden')}function addPartner(){let n=prompt('Partner name');if(!n)return;db.partners.push({name:n,phone:'Add phone',status:'Offline',order:'—',lat:17.43,lng:78.45});save();render('partners');toast('Partner added ✓')}function togglePartner(i){db.partners[i].status=db.partners[i].status==='Offline'?'Online':'Offline';save();render('partners')}function addProduct(){let n=prompt('Product name');if(n){db.products.push(n);save();render('products')}}function removeProduct(i){if(confirm('Remove this product?')){db.products.splice(i,1);save();render('products')}}function toggleTheme(){document.body.classList.toggle('dark');toast('Theme preference saved')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.view));render();</script></body></html>
